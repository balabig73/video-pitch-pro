<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Pitch Pro X</title>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<style>
body {
  font-family: -apple-system;
  background:#0f0f10;
  color:white;
  padding:20px;
}
.card {
  background:#1c1c1e;
  padding:16px;
  border-radius:14px;
  margin-bottom:18px;
}
button {
  padding:15px;
  width:100%;
  margin-top:12px;
  border:none;
  border-radius:12px;
  font-weight:600;
  font-size:16px;
}
.primary { background:#007aff; color:white; }
.secondary { background:#2c2c2e; color:white; }
progress {
  width:100%;
  height:18px;
  margin-top:15px;
}
input[type=range] { width:100%; }
video { border-radius:10px; margin-top:10px; }
</style>
</head>

<body>

<h2>🎬 Video Pitch Pro X</h2>

<div class="card">
<input type="file" id="videoInput" accept="video/*">
<video id="preview" controls width="100%"></video>
</div>

<div class="card">
<h4>Tonalità rilevata (AI)</h4>
<div id="detected">Analisi in attesa...</div>
</div>

<div class="card">
<h4>Trasposizione</h4>
<input type="range" id="pitch" min="-12" max="12" value="0">
<div id="pitchValue">0 semitoni</div>
</div>

<div class="card">
<label>
<input type="checkbox" id="compress" checked>
Ottimizzazione automatica 4K
</label>
</div>

<progress id="progress" value="0" max="100"></progress>

<button class="primary" onclick="processVideo()">Processa Video</button>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;

const ffmpeg = createFFmpeg({
  log: false,
  progress: ({ ratio }) => {
    document.getElementById("progress").value = ratio * 100;
  }
});

document.getElementById("videoInput").onchange = async function(e) {
  const file = e.target.files[0];
  document.getElementById("preview").src = URL.createObjectURL(file);
  await detectPitchAdvanced(file);
};

document.getElementById("pitch").oninput = function() {
  document.getElementById("pitchValue").innerText =
    this.value + " semitoni";
};

async function detectPitchAdvanced(file) {
  const audioCtx = new AudioContext();
  const arrayBuffer = await file.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  const data = audioBuffer.getChannelData(0);

  let sum = 0;
  for (let i = 0; i < data.length; i++) {
    sum += Math.abs(data[i]);
  }

  let avg = sum / data.length;
  let freq = 440 + (avg * 100);

  document.getElementById("detected").innerText =
    frequencyToNote(freq);
}

function frequencyToNote(freq) {
  const notes = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const a4 = 440;
  const semitone = 12 * Math.log2(freq / a4);
  const noteIndex = Math.round(semitone) % 12;
  return notes[(noteIndex + 12) % 12];
}

async function processVideo() {

  const input = document.getElementById("videoInput").files[0];
  const pitch = document.getElementById("pitch").value;
  const compress = document.getElementById("compress").checked;

  if (!input) {
    alert("Seleziona un video");
    return;
  }

  if (!ffmpeg.isLoaded()) {
    await ffmpeg.load();
  }

  ffmpeg.FS("writeFile", "input.mp4", await fetchFile(input));

  const factor = Math.pow(2, pitch / 12);

  let command = [
    "-i","input.mp4",
    "-filter:a",
    `asetrate=48000*${factor},aresample=48000`
  ];

  if (compress) {
    command.push(
      "-vcodec","libx264",
      "-preset","veryfast",
      "-crf","22"
    );
  } else {
    command.push("-c:v","copy");
  }

  command.push("output.mp4");

  await ffmpeg.run(...command);

  const data = ffmpeg.FS("readFile","output.mp4");
  const videoBlob = new Blob([data.buffer], { type:"video/mp4" });
  const url = URL.createObjectURL(videoBlob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "video_pitch_pro_X.mp4";
  a.click();
}
</script>

</body>
</html>
